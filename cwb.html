<html lang="zh-CN">
<head>

    <style>
        /* 1. 五颜六色闪烁的背景（Disco极速变色） */
        body {
            margin: 0;
            padding: 30px 10px;
            text-align: center;
            font-family: "Comic Sans MS", "SimSun", "Microsoft YaHei", sans-serif;
            animation: bgFlash 0.35s infinite alternate;
            overflow-x: hidden;
        }

        @keyframes bgFlash {
            0%   { background-color: #ff007f; }
            20%  { background-color: #00ffff; }
            40%  { background-color: #ffff00; }
            60%  { background-color: #76ff03; }
            80%  { background-color: #d500f9; }
            100% { background-color: #ff3d00; }
        }

        /* 2. 经典火星文跑马灯 */
        marquee {
            font-size: 1.3rem;
            color: #ffff00;
            background: #000;
            padding: 8px 0;
            border-top: 3px dashed #ff00de;
            border-bottom: 3px dashed #00ffcc;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* 3. 杀马特大红字标题（高频抖动 + 霓虹发光） */
        h1 {
            color: #ff0000; /* 纯正红字 */
            font-size: 3.5rem;
            margin: 15px 0 25px 0;
            text-shadow: 
                3px 3px 0 #000,
                -2px -2px 0 #ffff00,
                0 0 15px #ff0000,
                0 0 30px #ff00ff,
                0 0 50px #ff0000;
            letter-spacing: 4px;
            animation: titleShake 0.12s infinite;
            display: inline-block;
        }

        @keyframes titleShake {
            0%   { transform: translate(0, 0) rotate(0deg); }
            25%  { transform: translate(-3px, 2px) rotate(-1deg); }
            50%  { transform: translate(3px, -2px) rotate(1deg); }
            75%  { transform: translate(-2px, -2px) rotate(0deg); }
            100% { transform: translate(2px, 3px) rotate(1deg); }
        }

        /* 4. 视频容器与跑马灯边框效果 */
        .video-box {
            display: inline-block;
            padding: 15px;
            background: #000;
            border: 8px ridge #00ffff;
            box-shadow: 0 0 35px #ffff00, 0 0 60px #ff00ff;
            animation: borderGlow 0.3s infinite alternate;
            border-radius: 12px;
        }

        @keyframes borderGlow {
            0% {
                border-color: #00ff00;
                box-shadow: 0 0 25px #00ff00, 0 0 50px #ff00ff;
            }
            50% {
                border-color: #ffff00;
                box-shadow: 0 0 35px #ffff00, 0 0 70px #00ffff;
            }
            100% {
                border-color: #ff0055;
                box-shadow: 0 0 45px #ff0055, 0 0 90px #ffff00;
            }
        }

        /* 5. 视频样式 */
        video {
            display: block;
            max-width: 85vw;
            max-height: 65vh;
            border: 4px solid #fff;
            background-color: #000;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 1.4rem;
            color: #00ff00;
            background-color: rgba(0, 0, 0, 0.7);
            display: inline-block;
            padding: 6px 16px;
            border: 2px dotted #fff;
        }
    </style>
</head>
